<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>被动元件年报问答</title>
<style>
  :root { --blue:#2563eb; --bg:#f6f7fb; --line:#e4e7ef; --ink:#1f2430; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.75 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
  .wrap { max-width:920px; margin:28px auto 60px; padding:0 16px; }
  h1 { font-size:22px; margin:0 0 6px; }
  .sub { color:#69718a; font-size:13px; margin:0 0 18px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px;
          padding:16px 18px; margin-bottom:14px;
          box-shadow:0 1px 2px rgba(16,24,40,.04); }
  .row { display:flex; gap:10px; }
  input#q { flex:1; padding:11px 12px; border:1px solid var(--line);
            border-radius:8px; font-size:15px; outline:none; }
  input#q:focus { border-color:var(--blue); }
  button { background:var(--blue); color:#fff; border:0; border-radius:8px;
           padding:11px 22px; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #status { color:#69718a; font-size:13px; margin-top:10px; min-height:18px;
            white-space:pre-wrap; }
  h2 { font-size:16px; margin:0 0 10px; padding-bottom:8px;
       border-bottom:1px solid var(--line); }
  #answer { white-space:pre-wrap; }
  .src { border-top:1px dashed var(--line); padding:12px 0 10px; }
  .src:first-child { border-top:0; padding-top:2px; }
  .src .t { font-weight:600; }
  .src .m { color:#69718a; font-size:12.5px; margin:3px 0 6px; }
  .snip { background:#f8f9fc; border:1px solid var(--line); border-radius:8px;
          padding:8px 10px; font-size:13.5px; white-space:pre-wrap;
          max-height:220px; overflow:auto; }
  details summary { cursor:pointer; color:var(--blue); font-size:13px;
                    margin-top:6px; }
  .err { color:#b42318; background:#fef3f2; border:1px solid #fecdca;
         border-radius:8px; padding:10px 12px; }
  .foot { color:#9aa1b5; font-size:12px; text-align:center; margin-top:22px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>被动元件年报问答</h1>
  <p class="sub">语料：15 家被动元件上市公司 × 2025 年年度报告 ｜
     检索：本地向量（Qwen3-Embedding）+ BM25 双路融合 ｜ 答案：DeepSeek 生成</p>

  <div class="card">
    <div class="row">
      <input id="q" placeholder="例如：风华高科 2025 年营业收入是多少？" autofocus>
      <button id="go">提问</button>
    </div>
    <div id="status"></div>
  </div>

  <div class="card" id="answerCard" hidden>
    <h2>答案</h2>
    <div id="answer"></div>
  </div>

  <div class="card" id="srcCard" hidden>
    <h2>出处</h2>
    <div id="sources"></div>
  </div>

  <div class="foot">答案由 DeepSeek 依据下方原文块生成，关键信息均标注公司与页码，可对照原文核实。</div>
</div>

<script>
const $ = s => document.querySelector(s);

// 只把 **加粗** 还原成 <strong>，其余一律按纯文本插入（防注入）
function richText(text) {
  const frag = document.createDocumentFragment();
  String(text).split(/\*\*(.+?)\*\*/g).forEach((p, i) => {
    if (i % 2 === 1) {
      const b = document.createElement('strong');
      b.textContent = p;
      frag.appendChild(b);
    } else {
      frag.appendChild(document.createTextNode(p));
    }
  });
  return frag;
}

function showError(box, msg) {
  const e = document.createElement('div');
  e.className = 'err';
  e.textContent = msg;
  box.replaceChildren(e);
}

function renderSources(list) {
  const box = $('#sources');
  box.replaceChildren();
  (list || []).forEach(s => {
    const div = document.createElement('div');
    div.className = 'src';
    const t = document.createElement('div');
    t.className = 't';
    t.textContent = s['面包屑'];
    const m = document.createElement('div');
    m.className = 'm';
    const tags = [];
    if (s['向量名次']) tags.push(`向量检索 #${s['向量名次']}（相似度 ${s['向量相似度']}）`);
    if (s['BM25名次']) tags.push(`BM25 #${s['BM25名次']}（得分 ${s['BM25得分']}）`);
    m.textContent = tags.join('　｜　');
    const text = s['文本'] || '';
    const snip = document.createElement('div');
    snip.className = 'snip';
    snip.textContent = text.length > 320 ? text.slice(0, 320) + ' ……' : text;
    div.append(t, m, snip);
    if (text.length > 320) {
      const det = document.createElement('details');
      const sum = document.createElement('summary');
      sum.textContent = '展开完整原文';
      const full = document.createElement('div');
      full.className = 'snip';
      full.textContent = text;
      det.append(sum, full);
      div.appendChild(det);
    }
    box.appendChild(div);
  });
}

async function ask(question) {
  $('#go').disabled = true;
  $('#status').textContent = '检索中…（本地向量 + BM25 双路）然后请 DeepSeek 生成答案，通常几秒到半分钟';
  $('#answerCard').hidden = true;
  $('#srcCard').hidden = true;
  try {
    const r = await fetch('/api/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question})
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));

    const ans = $('#answer');
    if (d['答案错误']) {
      showError(ans, d['答案错误']);
    } else {
      ans.replaceChildren(richText(d['答案'] || '（模型返回空）'));
    }
    renderSources(d['出处']);
    $('#answerCard').hidden = false;
    $('#srcCard').hidden = false;

    const u = d['用时'] || {};
    $('#status').textContent =
      `完成 ｜ 向量检索 ${u['向量检索秒'] ?? '?'}s ｜ BM25 ${u['BM25秒'] ?? '?'}s` +
      ` ｜ 合计 ${u['合计秒'] ?? '?'}s`;
  } catch (e) {
    $('#status').textContent = '';
    showError($('#answer'), '请求失败：' + e.message);
    $('#answerCard').hidden = false;
  } finally {
    $('#go').disabled = false;
  }
}

$('#go').addEventListener('click', () => {
  const q = $('#q').value.trim();
  if (q) ask(q);
});
$('#q').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('#go').click();
});

// ?q=… 打开页面就自动提问（演示、截图用）
const q0 = new URLSearchParams(location.search).get('q');
if (q0) {
  $('#q').value = q0;
  ask(q0);
}
</script>
</body>
</html>
